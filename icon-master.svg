<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123a52"/>
      <stop offset="55%" stop-color="#1b5f83"/>
      <stop offset="100%" stop-color="#158c82"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2b077"/>
      <stop offset="100%" stop-color="#e8935a"/>
    </linearGradient>
    <linearGradient id="volcanoFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3b6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4fc3b6" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- safe-zone background (covers full canvas for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- sun / atardecer -->
  <circle cx="352" cy="168" r="46" fill="url(#sun)"/>

  <!-- far ridge -->
  <path d="M0 300 L110 220 L190 270 L300 190 L400 250 L512 200 L512 512 L0 512 Z" fill="url(#volcanoFar)"/>

  <!-- main volcano -->
  <path d="M0 512 L150 260 L200 320 L262 200 L340 340 L410 260 L512 400 L512 512 Z" fill="#f6f8f7"/>
  <path d="M262 200 L290 250 L234 250 Z" fill="#e8935a" opacity="0.9"/>

  <!-- añil accent stripe -->
  <rect x="0" y="472" width="512" height="40" fill="#3b4d8b" opacity="0.9"/>
</svg>
